<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AUREN</title>
    <meta
      name="description"
      content="Saluda con tu nombre y entra a AUREN. Autocrecimiento y Salud ya están abiertos."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <canvas id="stars" aria-hidden="true"></canvas>
    <div class="aurora" aria-hidden="true"></div>
    <div class="noise" aria-hidden="true"></div>

    <main class="stage">
      <section id="welcome">
        <p class="kicker">AUREN</p>
        <h1 class="title">Dilo. El universo responde.</h1>
        <p class="lede">
          Escribe tu nombre. Después del saludo entra a AUREN y elige tu camino.
        </p>

        <form id="greet-form" class="panel" autocomplete="off">
          <label for="name">Tu nombre</label>
          <div class="field">
            <input
              id="name"
              name="name"
              type="text"
              maxlength="40"
              placeholder="Ej. Daniela"
              required
              autofocus
            />
            <button type="submit">Saludar</button>
          </div>
          <p class="hint">El prototipo se abre solo después de saludarte.</p>
        </form>
      </section>

      <section id="greeting" class="greeting" hidden>
        <p class="hello" id="hello"></p>
        <p class="phrase" id="phrase"></p>
        <div class="actions">
          <button type="button" id="again">Otra frase</button>
          <button type="button" id="reset" class="ghost">Cambiar nombre</button>
        </div>
      </section>

      <section id="auren" class="auren" hidden>
        <p class="kicker">AUREN</p>
        <h2 class="section-title">Elige tu camino</h2>
        <p class="lede" id="auren-lede"></p>
        <div id="categories" class="categories"></div>
      </section>

      <section id="practice" class="practice panel" hidden>
        <p class="kicker" id="practice-kicker">Autocrecimiento</p>
        <h2 class="section-title" id="practice-title">Una vida maravillosa</h2>
        <p class="progress-label" id="practice-progress"></p>
        <p class="phrase-icon" id="phrase-icon" aria-hidden="true"></p>
        <p class="affirmation" id="affirmation"></p>
        <div class="actions">
          <button type="button" id="prev-phrase" class="ghost">Anterior</button>
          <button type="button" id="next-phrase">Siguiente</button>
        </div>
        <button type="button" id="back-auren" class="ghost back">Volver a AUREN</button>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
